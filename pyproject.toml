[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-logging-example"
version = "0.1.0"
description = "Standalone examples of Python logging configuration"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Timothy Heeg" },
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[project.scripts]
python-logging-example = "example:run"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["python_logging"]
py-modules = ["example", "log"]

[tool.setuptools.package-data]
python_logging = ["config/log.json"]
