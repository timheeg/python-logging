[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-logging-example"
version = "0.1.0"
description = "Standalone examples of Python logging configuration"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Timothy Heeg" },
]
dependencies = []

[project.scripts]
python-logging-example = "example:run"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["example", "log"]
